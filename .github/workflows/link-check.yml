name: Link check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  blog-links:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify blog series links
        run: python3 scripts/check-blog-links.py
