<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Akshant Sharma</title>
<meta name="description" content="Technical writing on distributed systems, AI infrastructure, and the engineering layer underneath.">
<meta name="theme-color" content="#fafaf9">
<script>(function(){if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --line: rgba(0, 0, 0, 0.09);
  --line2: rgba(0, 0, 0, 0.14);
  --text: #242424;
  --sub: #6b6b6b;
  --muted: #757575;
  --green: #1a8917;
  --hover-surface: rgba(0, 0, 0, 0.035);
  --font-ui: "Inter", system-ui, sans-serif;
  --font-serif: "Source Serif 4", Georgia, serif;
  --max: 728px;
}
html[data-theme="dark"] {
  --bg: #0f0f0e;
  --surface: #171716;
  --line: rgba(255, 255, 255, 0.09);
  --line2: rgba(255, 255, 255, 0.14);
  --text: #ececea;
  --sub: #a8a89e;
  --muted: #7c7c74;
  --green: #5bd37a;
  --hover-surface: rgba(255, 255, 255, 0.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
nav {
  position: sticky;
  top: 0;
  z-index: 200;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.ni {
  max-width: 860px;
  margin: 0 auto;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.nav-tail {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid var(--line2);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.theme-toggle:hover { border-color: var(--muted); }
.theme-toggle svg { width: 18px; height: 18px; display: block; }
.theme-toggle .icon-sun { display: none; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
.nl {
  font-family: var(--font-serif);
  font-weight: 600;
  font-size: 1.125rem;
  color: var(--text);
  text-decoration: none;
}
.nl:hover { color: var(--green); }
.nb {
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--muted);
  text-decoration: none;
}
.nb:hover { color: var(--text); }
.nb::before { content: "← "; }

.w { max-width: var(--max); margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

.hero { padding: 48px 0 32px; }
.eyebrow { font-size: 0.8125rem; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
.hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(2rem, 4vw, 2.75rem);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.1;
  margin-bottom: 12px;
}
.hero p { font-size: 1.0625rem; color: var(--sub); max-width: 540px; line-height: 1.68; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 28px 0 8px; }
.ftab {
  font-size: 0.75rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 99px;
  cursor: pointer;
  background: var(--surface);
  color: var(--muted);
  border: 1px solid var(--line);
  transition: all 0.15s;
  user-select: none;
}
.ftab:hover { border-color: var(--line2); color: var(--text); }
.ftab.active { background: rgba(26, 137, 23, 0.1); color: var(--green); border-color: rgba(26, 137, 23, 0.35); }
html[data-theme="dark"] .ftab.active {
  background: rgba(91, 211, 122, 0.12);
  border-color: rgba(91, 211, 122, 0.35);
}

.posts { display: flex; flex-direction: column; margin-bottom: 80px; }
.post-card{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  padding:24px 8px;
  border-bottom:1px solid var(--line);
  text-decoration:none;
  color:inherit;
  transition:border-color .15s ease, background .15s ease;
  border-radius:6px;
  margin:0 -8px;
}
.post-card:hover{
  background:var(--hover-surface);
  border-bottom-color:transparent;
}
.post-card:hover .post-title { color: var(--green); }
.post-left { flex: 1; min-width: 0; }
.post-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.ptag {
  font-size: 0.6875rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--muted);
  background: var(--bg);
}
.ptag-ds { border-color: #c7d2fe; color: #4338ca; background: #eef2ff; }
.ptag-ai { border-color: #bbf7d0; color: #15803d; background: #f0fdf4; }
.ptag-kb { border-color: #fde68a; color: #b45309; background: #fffbeb; }
.ptag-iot { border-color: #fecaca; color: #b91c1c; background: #fef2f2; }
.ptag-rs { border-color: #ddd6fe; color: #6d28d9; background: #f5f3ff; }
.ptag-tsdb { border-color: #bae6fd; color: #0369a1; background: #f0f9ff; }

.post-title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.25;
  margin-bottom: 6px;
  color: var(--text);
  transition: color 0.15s;
}
.post-excerpt { font-size: 0.9375rem; color: var(--sub); line-height: 1.55; }
.post-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
  font-size: 0.8125rem;
  color: var(--muted);
}
.post-arrow { color: var(--green); font-size: 1.125rem; }

.series-stack { margin-bottom: 2.5rem; }
.series-stack:last-of-type { margin-bottom: 0; }
.series-head {
  font-family: var(--font-serif);
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
  margin: 0 0 4px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.series-dek {
  font-size: 0.8125rem;
  color: var(--muted);
  margin: 0 0 12px;
  line-height: 1.45;
}

footer { border-top: 1px solid var(--line); padding: 32px 0 48px; }
.fi { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
.fn { font-family: var(--font-serif); font-size: 0.9375rem; font-weight: 600; color: var(--muted); }
.fl { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.fl a { font-size: 0.8125rem; color: var(--muted); text-decoration: none; font-weight: 500; }
.fl a:hover { color: var(--green); }
.fl a.ff-in {
  background: #0a66c2;
  color: #fff;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 600;
}
.fl a.ff-in:hover { color: #fff; background: #004182; }
.fl a.ff-em {
  background: #ea4335;
  color: #fff;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 600;
}
.fl a.ff-em:hover { color: #fff; background: #c5221f; }
.fl a.ff-gh {
  background: #24292f;
  color: #fff;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 600;
}
.fl a.ff-gh:hover { color: #fff; background: #1a1e22; }

@media (max-width: 640px) {
  .w, .ni { padding-left: 16px; padding-right: 16px; }
  .post-card { flex-direction: column; }
  .post-right { flex-direction: row; align-items: center; }
}
</style>
</head>
<body>

<nav>
  <div class="ni">
    <a href="../index.html" class="nl">Akshant Sharma</a>
    <div class="nav-tail">
      <a href="../index.html" class="nb">Home</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<div class="w">

  <div class="filters">
    <div class="ftab active" onclick="filter(this,'all')">All posts</div>
    <div class="ftab" onclick="filter(this,'distributed-systems')">Distributed systems</div>
    <div class="ftab" onclick="filter(this,'ai-infra')">AI Infra</div>
    <div class="ftab" onclick="filter(this,'kafka')">Kafka</div>
    <div class="ftab" onclick="filter(this,'rust')">Rust</div>
    <div class="ftab" onclick="filter(this,'tsdb')">TSDB</div>
    <div class="ftab" onclick="filter(this,'iot')">IoT</div>
  </div>

  <div class="posts" id="posts-list" aria-live="polite"></div>

</div>

      <div class="fn">Akshant Sharma</div>

        <a href="https://github.com/AkshantVats" class="ff-gh">GitHub</a>
        <a href="https://linkedin.com/in/akshantsharma07" class="ff-in">LinkedIn</a>
        <a href="mailto:akshant3@gmail.com" class="ff-em">Email</a>
      </div>
    </div>
  </div>
</footer>

<script>
(function () {
  var KEY = "theme";
  var root = document.documentElement;
  var meta = document.querySelector('meta[name="theme-color"]');
  function apply(dark) {
    if (dark) {
      root.setAttribute("data-theme", "dark");
      if (meta) meta.setAttribute("content", "#0f0f0e");
    } else {
      root.removeAttribute("data-theme");
      if (meta) meta.setAttribute("content", "#fafaf9");
    }
    localStorage.setItem(KEY, dark ? "dark" : "light");
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      btn.title = dark ? "Light mode" : "Dark mode";
    }
  }
  document.getElementById("theme-toggle")?.addEventListener("click", function () {
    apply(root.getAttribute("data-theme") !== "dark");
  });
})();

(function () {
  var MANIFEST = "series-index.json";
  var root = document.getElementById("posts-list");
  if (!root) return;

  function metaAttr(doc, sel, name) {
    var n = doc.querySelector(sel);
    return n && n.getAttribute(name) ? n.getAttribute(name).trim() : "";
  }

  function parsePublished(doc) {
    return metaAttr(doc, 'meta[property="article:published_time"]', "content");
  }

  function parseModified(doc) {
    return metaAttr(doc, 'meta[property="article:modified_time"]', "content");
  }

  function sortKeyForDoc(doc) {
    var pub = parsePublished(doc);
    var mod = parseModified(doc);
    if (pub && mod) return pub > mod ? pub : mod;
    return mod || pub || "";
  }

  function sortKeyMs(key) {
    var ms = Date.parse(String(key || ""));
    return isNaN(ms) ? 0 : ms;
  }

  function compareSortKeysDesc(a, b) {
    return sortKeyMs(b) - sortKeyMs(a);
  }

  function todayIso() {
    var d = new Date();
    return (
      d.getFullYear() +
      "-" +
      String(d.getMonth() + 1).padStart(2, "0") +
      "-" +
      String(d.getDate()).padStart(2, "0")
    );
  }

  function isLiveSortKey(sk, today) {
    return sk && sk <= today;
  }

  function pickMetaLine(doc) {
    var el = doc.querySelector(".post-meta");
    if (!el) return "";
    var dateRe = /^[A-Za-z]{3,9}\s+\d{4}$/;
    var readRe = /\d+\s*min\s*read/i;
    var d = "",
      r = "";
    el.querySelectorAll(".meta-item").forEach(function (n) {
      var t = (n.textContent || "").trim();
      if (dateRe.test(t)) d = t;
      if (readRe.test(t)) r = t;
    });
    if (d && r) return d + " · " + r;
    var bits = [];
    el.querySelectorAll(":scope > span").forEach(function (n) {
      if (n.classList.contains("sep")) return;
      var t = (n.textContent || "").trim();
      if (t) bits.push(t);
    });
    return bits.filter(Boolean).join(" · ");
  }

  function excerptFrom(doc) {
    var d = metaAttr(doc, 'meta[name="description"]', "content");
    if (!d) return "";
    if (d.length > 220) return d.slice(0, 217) + "…";
    return d;
  }

  function titleFrom(doc) {
    var t = metaAttr(doc, 'meta[property="og:title"]', "content");
    if (t) return t;
    var tit = doc.querySelector("title");
    return tit ? tit.textContent.replace(/\s*[—–-]\s*Akshant.*$/i, "").trim() : "";
  }

  var TAG_SLUG = {
    "distributed systems": "distributed-systems",
    "ai infra": "ai-infra",
    "ai learning": "ai-infra",
    "llm inference": "ai-infra",
    kafka: "kafka",
    rust: "rust",
    tsdb: "tsdb",
    iot: "iot"
  };

  function tagSlug(label) {
    var t = (label || "").trim().toLowerCase();
    if (TAG_SLUG[t]) return TAG_SLUG[t];
    return t.replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function ptagClass(slug) {
    if (slug === "distributed-systems") return "ptag-ds";
    if (slug === "ai-infra") return "ptag-ai";
    if (slug === "rust") return "ptag-rs";
    if (slug === "tsdb") return "ptag-tsdb";
    if (slug === "kafka") return "ptag-kb";
    if (slug === "iot") return "ptag-iot";
    return "";
  }

  function tagsFrom(doc) {
    var slugs = [];
    var labels = [];
    doc.querySelectorAll(".post-tags .tag:not(.accent), .post-tags .ptag").forEach(function (n) {
      var label = (n.textContent || "").trim();
      if (!label) return;
      var slug = tagSlug(label);
      if (!slug || slugs.indexOf(slug) >= 0) return;
      slugs.push(slug);
      labels.push(label);
    });
    return { slugs: slugs, labels: labels };
  }

  function parsePostHtml(html, href) {
    var p = new DOMParser().parseFromString(html, "text/html");
    var sk = sortKeyForDoc(p);
    if (!sk) return null;
    var metaLine = pickMetaLine(p);
    var parts = metaLine.split("·").map(function (s) {
      return s.trim();
    });
    var tagInfo = tagsFrom(p);
    return {
      href: href,
      sortKey: sk,
      metaLine: metaLine,
      dateLabel: parts[0] || "",
      readLabel: parts[1] || "",
      title: titleFrom(p),
      excerpt: excerptFrom(p),
      tagSlugs: tagInfo.slugs,
      tagLabels: tagInfo.labels
    };
  }

  function postHref(ref) {
    if (ref == null) return "";
    if (typeof ref === "string") return ref;
    return ref.href || "";
  }

  function cardHref(manifestHref) {
    if (!manifestHref) return "";
    if (manifestHref.indexOf("blog/") === 0) return manifestHref.slice(5);
    return manifestHref;
  }

  function fetchPost(manifestHref) {
    var href = cardHref(manifestHref);
    if (!href || href === "#") return Promise.resolve(null);
    return fetch(href, { credentials: "same-origin" })
      .then(function (r) {
        return r.ok ? r.text() : Promise.reject();
      })
      .then(function (html) {
        return parsePostHtml(html, href);
      })
      .catch(function () {
        return null;
      });
  }

  function renderCard(post) {
    var a = document.createElement("a");
    a.className = "post-card";
    a.href = post.href;
    a.setAttribute("data-tags", post.tagSlugs.join(" "));

    var left = document.createElement("div");
    left.className = "post-left";
    var tagsWrap = document.createElement("div");
    tagsWrap.className = "post-tags";
    post.tagSlugs.forEach(function (slug, i) {
      var span = document.createElement("span");
      var cls = ptagClass(slug);
      span.className = "ptag" + (cls ? " " + cls : "");
      span.textContent = post.tagLabels[i] || slug.replace(/-/g, " ");
      tagsWrap.appendChild(span);
    });
    var title = document.createElement("div");
    title.className = "post-title";
    title.textContent = post.title || post.href;
    var excerpt = document.createElement("div");
    excerpt.className = "post-excerpt";
    excerpt.textContent = post.excerpt || "";
    left.appendChild(tagsWrap);
    left.appendChild(title);
    left.appendChild(excerpt);

    var right = document.createElement("div");
    right.className = "post-right";
    var d = document.createElement("div");
    d.textContent = post.dateLabel || "";
    var r = document.createElement("div");
    r.textContent = post.readLabel || "";
    var arrow = document.createElement("span");
    arrow.className = "post-arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "→";
    right.appendChild(d);
    right.appendChild(r);
    right.appendChild(arrow);

    a.appendChild(left);
    a.appendChild(right);
    return a;
  }

  fetch(MANIFEST, { credentials: "same-origin" })
    .then(function (r) {
      return r.ok ? r.json() : Promise.reject();
    })
    .then(function (data) {
      var seriesList = (data && data.series ? data.series : []).filter(function (s) {
        return s && s.posts && s.posts.length;
      });
      if (!seriesList.length) return Promise.reject();

      var today = todayIso();
      var jobs = [];
      seriesList.forEach(function (s) {
        s.posts.forEach(function (ref) {
          var h = postHref(ref);
          if (h && h !== "#" && h.indexOf("#") !== 0) jobs.push({ series: s, ref: ref, manifestHref: h });
        });
      });

      return Promise.all(
        jobs.map(function (j) {
          return fetchPost(j.manifestHref).then(function (row) {
            if (row) {
              row = {
                href: row.href,
                sortKey: row.sortKey,
                metaLine: row.metaLine,
                dateLabel: row.dateLabel,
                readLabel: row.readLabel,
                title: row.title,
                excerpt: row.excerpt,
                tagSlugs: row.tagSlugs,
                tagLabels: row.tagLabels
              };
            }
            return { series: j.series, post: row };
          });
        })
      ).then(function (rows) {
        var bySeries = {};
        rows.forEach(function (row) {
          if (!row.post) return;
          var slug = row.series.slug || "";
          if (!bySeries[slug]) bySeries[slug] = { series: row.series, posts: [] };
          bySeries[slug].posts.push(row.post);
        });

        var blocks = Object.keys(bySeries).map(function (slug) {
          var block = bySeries[slug];
          block.posts.sort(function (a, b) {
            return compareSortKeysDesc(a.sortKey, b.sortKey);
          });
          var activity = block.posts.reduce(function (acc, p) {
            return !acc || sortKeyMs(p.sortKey) > sortKeyMs(acc) ? p.sortKey : acc;
          }, "");
          var activityLive = block.posts.reduce(function (acc, p) {
            if (!isLiveSortKey(p.sortKey, today)) return acc;
            return !acc || sortKeyMs(p.sortKey) > sortKeyMs(acc) ? p.sortKey : acc;
          }, "");
          return { series: block.series, posts: block.posts, activity: activity, activityLive: activityLive };
        });

        blocks.sort(function (a, b) {
          var aLive = !!a.activityLive;
          var bLive = !!b.activityLive;
          if (aLive !== bLive) return aLive ? -1 : 1;
          return compareSortKeysDesc(a.activityLive || a.activity, b.activityLive || b.activity);
        });

        root.textContent = "";
        blocks.forEach(function (block) {
          if (!block.posts.length) return;
          var s = block.series;
          var sec = document.createElement("section");
          sec.className = "series-stack";
          var sid = "series-" + (s.slug || "writing");
          sec.setAttribute("aria-labelledby", sid);
          var h2 = document.createElement("h2");
          h2.className = "series-head";
          h2.id = sid;
          h2.textContent = s.title || s.slug || "Series";
          var dek = document.createElement("p");
          dek.className = "series-dek";
          dek.textContent = s.dek || s.navSubtitle || "";
          sec.appendChild(h2);
          if (dek.textContent) sec.appendChild(dek);
          block.posts.forEach(function (p) {
            sec.appendChild(renderCard(p));
          });
          root.appendChild(sec);
        });
      });
    })
    .catch(function () {
      root.innerHTML = '<p class="series-dek">Could not load posts.</p>';
    });
})();

function filter(tab, tag) {
  document.querySelectorAll(".ftab").forEach((t) => t.classList.remove("active"));
  tab.classList.add("active");
  document.querySelectorAll(".post-card").forEach((card) => {
    if (tag === "all") {
      card.style.display = "";
    } else {
      const tags = (card.dataset.tags || "").split(" ");
      card.style.display = tags.includes(tag) ? "" : "none";
    }
  });
}
</script>
